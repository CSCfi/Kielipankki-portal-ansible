---
# harden mariadb installation


- name: Set root user password
  command: mysqladmin -u root password "{{ mysql_root_password }}"
  # if error, the root user has been set already
  ignore_errors: true

- name: Create install user
  ansible.mariadb.mariadb_user:
    name: "{{ wp_db_install_user }}"
    password: "{{ wp_db_install_password }}"
    login_user: root
    login_password: "{{ mysql_root_password }}"
    priv: '*.*:ALL'
    state: present

- name: Delete anonymous MySQL server user for current hostname
  ansible.mariadb.mariadb_user:
    name: ""
    host: "{{ ansible_facts['hostname'] }}"
    state: absent
    login_user: root
    login_password: "{{ mysql_root_password }}"

- name: Remove the test database
  ansible.mariadb.mariadb_db:
    name: test
    state: absent
    login_user: root
    login_password: "{{ mysql_root_password }}"
